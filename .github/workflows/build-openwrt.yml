name: Build ImmortalWrt

on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "ImmortalWrt source repository"
        required: true
        default: "https://github.com/bingoguo93/immortalwrt.git"
      source_branch:
        description: "ImmortalWrt source branch"
        required: true
        default: "6.18"
      config_file:
        description: "Seed config path in this repo"
        required: true
        default: "build-config/seed.config"
      upload_release:
        description: "Upload firmware to GitHub Release"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  schedule:
    - cron: "0 20 * * 5"

permissions:
  contents: write

concurrency:
  group: build-openwrt-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  SOURCE_REPO: https://github.com/bingoguo93/immortalwrt.git
  SOURCE_BRANCH: "6.18"
  SOURCE_DIR: immortalwrt-25.12
  TARGET_PLATFORM: airoha/an7581
  PLATFORM_TYPE: airoha
  CPU: an7581
  DEVICE_NAME: 040GMD
  DEVICE_MODEL: bell_xg-040g-md
  LAN_IP: 192.168.1.1
  FACTORY_BIN: immortalwrt-airoha-an7581-bell_xg-040g-md-squashfs-factory.bin
  SYSUPGRADE_BIN: immortalwrt-airoha-an7581-bell_xg-040g-md-squashfs-sysupgrade.bin
  CONFIG_FILE: build-config/seed.config
  PACKAGES_FILE: build-config/packages.config
  DIY_SCRIPT: build-config/diy.sh
  UPLOAD_RELEASE: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Set build inputs
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "SOURCE_REPO=${{ inputs.source_repo }}" >> "$GITHUB_ENV"
            echo "SOURCE_BRANCH=${{ inputs.source_branch }}" >> "$GITHUB_ENV"
            echo "CONFIG_FILE=${{ inputs.config_file }}" >> "$GITHUB_ENV"
            echo "UPLOAD_RELEASE=${{ inputs.upload_release }}" >> "$GITHUB_ENV"
          fi

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout build config
        uses: actions/checkout@v4
        with:
          path: config-repo
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext \
            gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
            python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      - name: Clone ImmortalWrt source
        run: |
          git clone --depth=1 --single-branch --branch="$SOURCE_BRANCH" "$SOURCE_REPO" "$SOURCE_DIR"
          cp -a config-repo/build-config "$SOURCE_DIR/build-config"

      - name: Update feeds
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Run custom script
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          if [ -f "$DIY_SCRIPT" ]; then
            chmod +x "$DIY_SCRIPT"
            "$DIY_SCRIPT"
          fi

      - name: Generate config
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          cp "$CONFIG_FILE" .config
          if [ -f "$PACKAGES_FILE" ]; then
            cat "$PACKAGES_FILE" >> .config
          fi
          make defconfig
          ./scripts/diffconfig.sh > build-config/final.diffconfig
          cat build-config/final.diffconfig

      - name: Download sources
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          make download -j"$(nproc)" V=s
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Compile firmware
        working-directory: ${{ env.SOURCE_DIR }}
        run: make -j"$(nproc)" V=s

      - name: Collect firmware
        working-directory: ${{ env.SOURCE_DIR }}
        run: |
          mkdir -p ../firmware ../release-assets
          find bin/targets -type f \( \
            -name "*.bin" -o -name "*.manifest" -o -name "*.buildinfo" \
            -o -name "*.json" -o -name "sha256sums" \
          \) -exec cp -v {} ../firmware/ \;
          cp build-config/final.diffconfig ../firmware/final.diffconfig

          mapfile -t factory_bins < <(find ../firmware -maxdepth 1 -type f -iname "*${DEVICE_MODEL}*factory*.bin" | sort)
          if [ "${#factory_bins[@]}" -eq 0 ]; then
            mapfile -t factory_bins < <(find ../firmware -maxdepth 1 -type f -iname "*factory*.bin" | sort)
          fi
          if [ "${#factory_bins[@]}" -eq 0 ]; then
            echo "No factory .bin image was found for ${DEVICE_MODEL}." >&2
            exit 1
          fi
          cp "${factory_bins[0]}" "../release-assets/${FACTORY_BIN}"

          mapfile -t sysupgrade_bins < <(find ../firmware -maxdepth 1 -type f -iname "*${DEVICE_MODEL}*sysupgrade*.bin" | sort)
          if [ "${#sysupgrade_bins[@]}" -eq 0 ]; then
            mapfile -t sysupgrade_bins < <(find ../firmware -maxdepth 1 -type f -iname "*sysupgrade*.bin" | sort)
          fi
          if [ "${#sysupgrade_bins[@]}" -eq 0 ]; then
            echo "No sysupgrade .bin image was found for ${DEVICE_MODEL}." >&2
            exit 1
          fi
          cp "${sysupgrade_bins[0]}" "../release-assets/${SYSUPGRADE_BIN}"

      - name: Generate release notes
        run: |
          BUILD_TIME="$(date +'%Y.%m.%d-%H%M')"
          echo "RELEASE_TAG=$BUILD_TIME" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=$BUILD_TIME" >> "$GITHUB_ENV"

          KERNEL_VERSION="$(find firmware -name '*.buildinfo' -print -quit | xargs -r grep -E '^kernel_version=' | head -n1 | cut -d= -f2-)"
          if [ -z "$KERNEL_VERSION" ]; then
            KERNEL_VERSION="$(grep -E '^CONFIG_LINUX_[0-9_]+=y' firmware/final.diffconfig | head -n1 | sed -E 's/CONFIG_LINUX_([0-9]+)_([0-9]+).*/\1.\2/')"
          fi
          if [ -z "$KERNEL_VERSION" ]; then
            KERNEL_VERSION="6.18"
          fi

          {
            echo "## ${DEVICE_NAME} ImmortalWrt"
            echo
            echo "- 目标平台: ${TARGET_PLATFORM}"
            echo "- 平台类型: ${PLATFORM_TYPE}"
            echo "- CPU: ${CPU}"
            echo "- 设备型号: ${DEVICE_MODEL}"
            echo "- 管理地址: ${LAN_IP}"
            echo "- 内核版本: ${KERNEL_VERSION}"
            echo "- 默认用户: root"
            echo "- 默认密码: 空"
            echo
            echo "### 编译信息"
            echo "- 源码仓库: ${SOURCE_REPO}"
            echo "- 源码分支: ${SOURCE_BRANCH}"
            echo "- 配置仓库: ${GITHUB_REPOSITORY}"
            echo "- 配置提交: ${GITHUB_SHA}"
            echo "- 配置文件: ${CONFIG_FILE}"
            echo "- 插件文件: ${PACKAGES_FILE}"
            echo "- 编译时间: ${BUILD_TIME} ${TZ}"
            echo
            echo "### 主要插件"
            echo "#### luci-app 软件包"
            grep -E '^CONFIG_PACKAGE_luci-app-.+=y$' firmware/final.diffconfig \
              | sed -E 's/^CONFIG_PACKAGE_(luci-app-[^=]+)=y$/- \1/' \
              | sort -u || true
            echo
            echo "#### NPU 软件包"
            grep -Ei '^CONFIG_PACKAGE_[^=]*npu[^=]*=y$' firmware/final.diffconfig \
              | sed -E 's/^CONFIG_PACKAGE_([^=]+)=y$/- \1/' \
              | sort -u || true
          } > release-body.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-firmware
          path: |
            firmware
            release-assets
          retention-days: 14

      - name: Create release
        if: env.UPLOAD_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          body_path: release-body.md
          files: release-assets/*
